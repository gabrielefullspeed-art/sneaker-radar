# ============================================================
#  WATCHLIST — le scarpe da monitorare
# ============================================================
#  Campi:
#    sku      codice modello Nike ufficiale
#    name     nome mostrato nelle notifiche
#    gender   men | women  -> decide la conversione taglie.
#             ATTENZIONE: sulle uscite WMNS la tua EU 42 e' US W 10,
#             non US M 8.5
#    retail   listino originale in USD (informativo)
#    terms    cosa digitare nella ricerca dei siti. CORTI: le ricerche
#             fanno AND su tutte le parole, "Travis Scott Jordan 1 Low
#             Olive" non trova nulla, "Travis Scott" trova tutto
#    match    tutte queste devono comparire nel titolo per confermare
#             che sia la scarpa giusta. "|" = alternative equivalenti
#    exclude  se compare una di queste, l'annuncio viene scartato
#    grail    true -> canale Telegram separato
#    vintage  true -> avviso sulla condizione nella notifica
#
#  --- limiti manuali, facoltativi e per singola scarpa ---
#    reference  prezzo di base deciso da te, invece di quello StockX
#    max_price  notifica SOLO a questo prezzo o meno. Dove lo metti,
#               disattiva percentile e sconto minimo: comandi tu.
#    Le scarpe senza questi due campi continuano con la regola
#    automatica, non cambia nulla per loro.
# ============================================================

